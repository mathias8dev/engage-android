name: Release to JitPack

on:
  push:
    tags: ['*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          path: source/engage_push_fcm
      - uses: actions/checkout@v6
        with:
          repository: mathias8dev/engage-android-core
          ref: ${{ github.ref_name }}
          path: source/engage_core
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Validate semantic version
        working-directory: source/engage_push_fcm
        run: |
          release_version="$(sed -nE 's/^engageReleaseVersion[[:space:]]*=[[:space:]]*([^[:space:]]+).*$/\1/p' gradle.properties | head -n 1)"
          [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$GITHUB_REF_NAME" == "$release_version" ]]
      - name: Build, test, and verify publication
        working-directory: source/engage_push_fcm
        run: ./gradlew clean build publishToMavenLocal -PengageVersion="$GITHUB_REF_NAME" -PengageDependencyVersion="$GITHUB_REF_NAME"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
      - name: Build and verify the JitPack artifact
        run: |
          repository="${GITHUB_REPOSITORY#*/}"
          pom_url="https://jitpack.io/com/github/${GITHUB_REPOSITORY_OWNER}/${repository}/${GITHUB_REF_NAME}/${repository}-${GITHUB_REF_NAME}.pom"
          curl --fail-with-body --location --retry 20 --retry-delay 15 --retry-all-errors --connect-timeout 30 --max-time 900 "$pom_url" --output /tmp/engage-release.pom
