[tools]
java = "temurin-21"

[env]
ANDROID_HOME = "{{ get_env(name='ANDROID_HOME', default=env.HOME ~ '/Android/Sdk') }}"
ANDROID_SDK_ROOT = "{{ get_env(name='ANDROID_SDK_ROOT', default=get_env(name='ANDROID_HOME', default=env.HOME ~ '/Android/Sdk')) }}"

[tasks.check]
description = "Build, test, and verify every Android publication"
run = "./gradlew clean build publishToMavenLocal"

[tasks.release]
description = "Push main and let CI create the versioned GitHub/JitPack release"
confirm = "Push the Engage Android release branch?"
run = "git push origin main"
