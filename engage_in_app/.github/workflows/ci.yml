name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: source/engage_in_app
      - uses: actions/checkout@v6
        with:
          repository: mathias8dev/engage-android-core
          path: source/engage_core
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build, test, and verify publication
        working-directory: source/engage_in_app
        run: |
          release_version="$(sed -nE 's/^engageReleaseVersion[[:space:]]*=[[:space:]]*([^[:space:]]+).*$/\1/p' gradle.properties | head -n 1)"
          build_version="$release_version-$(date -u +%y%m%d%H%M)"
          ./gradlew clean build publishToMavenLocal -PengageVersion="$build_version"

  release:
    needs: android
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: source/engage_in_app
      - name: Resolve release version and tag state
        id: release
        working-directory: source/engage_in_app
        run: |
          version="$(sed -nE 's/^engageReleaseVersion[[:space:]]*=[[:space:]]*([^[:space:]]+).*$/\1/p' gradle.properties | head -n 1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag $version already exists; skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.release.outputs.exists == 'false'
        with:
          repository: mathias8dev/engage-android-core
          ref: ${{ steps.release.outputs.version }}
          path: source/engage_core
      - uses: actions/setup-java@v5
        if: steps.release.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: steps.release.outputs.exists == 'false'
        with:
          cache-provider: basic
      - name: Verify the release build
        if: steps.release.outputs.exists == 'false'
        working-directory: source/engage_in_app
        run: ./gradlew clean build publishToMavenLocal -PengageVersion="${{ steps.release.outputs.version }}" -PengageDependencyVersion="${{ steps.release.outputs.version }}"
      - name: Create tag and GitHub release
        if: steps.release.outputs.exists == 'false'
        working-directory: source/engage_in_app
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.release.outputs.version }}" --target "$GITHUB_SHA" --generate-notes --title "${{ steps.release.outputs.version }}"
      - name: Build and verify the JitPack artifact
        if: steps.release.outputs.exists == 'false'
        run: |
          repository="${GITHUB_REPOSITORY#*/}"
          version="${{ steps.release.outputs.version }}"
          pom_url="https://jitpack.io/com/github/${GITHUB_REPOSITORY_OWNER}/${repository}/${version}/${repository}-${version}.pom"
          curl --fail-with-body --location --retry 20 --retry-delay 15 --retry-all-errors --connect-timeout 30 --max-time 900 "$pom_url" --output /tmp/engage-release.pom
